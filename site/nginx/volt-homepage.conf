# Managed Volt homepage (volt.jjricks.com). Installed as /etc/nginx/sites-available/volt-homepage.
# Static files only. Releases live in /var/www/volt-home/releases/<commit>; "current" points at one.
# Preserve the ACME webroot: unattended certificate renewal uses it over port 80.
server {
    listen 80;
    listen [::]:80;
    server_name volt.jjricks.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/volt-home-acme;
        default_type text/plain;
        autoindex off;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 308 https://volt.jjricks.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name volt.jjricks.com;
    ssl_certificate /etc/letsencrypt/live/volt.jjricks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/volt.jjricks.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    access_log off;

    root /var/www/volt-home/current;
    index index.html;
    autoindex off;
    types {
        text/html html;
        text/css css;
        application/javascript js;
        image/svg+xml svg;
        image/png png;
        image/webp webp;
        font/ttf ttf;
        application/manifest+json webmanifest;
        text/plain txt;
        application/xml xml;
    }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json text/plain application/xml;

    # Server-level headers apply to every location below, none of which adds its own.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/volt-home-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = / {
        limit_except GET { deny all; }
        expires epoch;
        try_files /index.html =404;
    }
    location / {
        limit_except GET { deny all; }
        expires 1h;
        try_files $uri =404;
    }
}
