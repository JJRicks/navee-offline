<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Saira;src:url("../../res/font/saira_medium.ttf");font-weight:500;font-display:block}
@font-face{font-family:Saira;src:url("../../res/font/saira_bold.ttf");font-weight:700;font-display:block}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0a0a0b;color:#f5f5ef;font-family:Saira,sans-serif}
.card{position:relative;width:1200px;height:630px;overflow:hidden;
 background:radial-gradient(620px 520px at 905px 300px,rgba(234,37,43,.55),transparent 62%),radial-gradient(500px 400px at 120px 640px,rgba(255,138,31,.16),transparent 60%),#0a0a0b}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(900px 500px at 30% 40%,#000,transparent 75%)}
.copy{position:absolute;left:76px;top:70px;width:640px}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px;letter-spacing:.22em}
.brand svg{width:54px;height:54px;filter:drop-shadow(0 0 14px rgba(234,37,43,.75))}
h1{margin:44px 0 0;font-weight:700;font-size:104px;line-height:.9;letter-spacing:-.04em}
.hot{display:block;background:linear-gradient(100deg,#ff7a45,#ea252b 45%,#ff9b45);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(234,37,43,.5))}
p{margin:30px 0 0;font-weight:500;font-size:29px;line-height:1.35;color:#c9c9c3}
.meta{position:absolute;left:76px;bottom:62px;display:flex;gap:12px}
.meta span{padding:10px 18px;border-radius:999px;border:1px solid rgba(234,37,43,.45);background:rgba(234,37,43,.12);font-size:20px;font-weight:500;color:#ffd6d2}
.ring{position:absolute;left:705px;top:85px;width:400px;height:400px;border-radius:50%;border:2px dashed rgba(234,37,43,.32)}
.phone{position:absolute;left:792px;top:58px;width:262px;padding:9px;border-radius:42px;background:linear-gradient(150deg,#34343a,#101012 40%,#050506);
 box-shadow:0 0 0 1px rgba(255,255,255,.12),0 40px 120px -20px rgba(234,37,43,.75),0 30px 60px -20px #000;transform:perspective(1400px) rotateY(-16deg) rotateX(6deg) rotateZ(2deg)}
.phone img{display:block;width:100%;border-radius:34px}
.url{position:absolute;right:56px;bottom:30px;font-size:20px;font-weight:500;color:#a5a59f;letter-spacing:.04em}
</style></head><body><div class="card"><div class="grid"></div>
<div class="copy">
 <div class="brand"><svg viewBox="0 0 108 108"><path fill="#EA252B" d="M66,27 L38,61 L54,61 L49,86 L79,50 L62,50 Z"/><path fill="#F5F5EF" d="M62,24 L34,58 L50,58 L45,83 L75,47 L58,47 Z"/></svg>VOLT</div>
 <h1>Total control.<span class="hot">Zero cloud.</span></h1>
 <p>The offline command center for your NAVEE scooter. Lock, tune, track and ride over Bluetooth.</p>
</div>
<div class="meta"><span>Android</span><span>No account</span><span>Works offline</span></div>
<div class="ring"></div>
<div class="phone"><img src="../src/img/phone-home.webp" alt=""></div>
<div class="url">volt.jjricks.com</div>
</div></body></html>
